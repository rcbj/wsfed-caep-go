#
# The nightly half. The unit suite is the test image. The live half signs the demo in to a fresh
# iya-sts. Push and pull-request CI stays in tests.yml.
name: Nightly

on:
  schedule:
    # 07:22 UTC. The authentication client libraries share one two-hour window.
    - cron: '22 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit suite
        run: docker build --target test .
      - name: Live iya-sts
        run: python3 scripts/live_iya_sts.py
